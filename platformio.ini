; Jubilon Watchy autopilot — M1 SIM_MODE
; Self-contained lib/Watchy + PlatformIO lib_deps (no symlinks to old Mac)

[platformio]
default_envs = watchy

[env:watchy]
platform = espressif32
board = watchy
framework = arduino
lib_deps =
  arduino-libraries/Arduino_JSON
  tzapu/WiFiManager
  adafruit/Adafruit GFX Library
  zinggjm/GxEPD2
  jchristensen/DS3232RTC@3.1.2
  arduino-libraries/NTPClient
  elpaso/Rtc_Pcf8563
  paulstoffregen/Time
monitor_speed = 115200
upload_speed = 115200
upload_port = /dev/cu.usbserial-56230044801
board_build.variants_dir = variants
build_flags =
  -DARDUINO_WATCHY_V20
  -DSIM_MODE=1
  -Ilib/Watchy/src

[env:watchy-v10]
extends = env:watchy
build_flags =
  -DARDUINO_WATCHY_V10
  -DSIM_MODE=1
  -Ilib/Watchy/src

[env:watchy-v15]
extends = env:watchy
build_flags =
  -DARDUINO_WATCHY_V15
  -DSIM_MODE=1
  -Ilib/Watchy/src

[env:watchy-live]
extends = env:watchy
build_flags =
  -DARDUINO_WATCHY_V20
  -DSIM_MODE=0
  -Ilib/Watchy/src
