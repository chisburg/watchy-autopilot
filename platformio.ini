; Jubilon Watchy autopilot — M1 SIM_MODE
; Self-contained lib/: patched Watchy (BLE stub) + symlinked deps

[platformio]
default_envs = watchy

[env:watchy]
platform = espressif32
board = watchy
framework = arduino
monitor_speed = 115200
upload_speed = 460800
upload_port = /dev/cu.usbserial-56230044801
board_build.variants_dir = variants
build_flags =
  -DARDUINO_WATCHY_V20
  -DSIM_MODE=1
  -Ilib/Watchy/src

[env:watchy-v10]
extends = env:watchy
build_flags =
  -DARDUINO_WATCHY_V10
  -DSIM_MODE=1
  -Ilib/Watchy/src

[env:watchy-v15]
extends = env:watchy
build_flags =
  -DARDUINO_WATCHY_V15
  -DSIM_MODE=1
  -Ilib/Watchy/src
